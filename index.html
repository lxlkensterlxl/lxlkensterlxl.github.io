<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SukiBot // CYBER HUD & ANIME AVATAR ENGINE</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- WebLLM Engine CDN Module Import -->
    <script type="module">
        import * as webLLM from "https://esm.run/@mlc-ai/web-llm";
        window.webLLM = webLLM;
        window.dispatchEvent(new CustomEvent('mlc-loaded'));
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberDark: '#07050e',
                        cyberPanel: '#0e081c',
                        cyberCard: '#150d2a',
                        cyberPurple: '#a855f7',
                        cyberPink: '#ec4899',
                        cyberCyan: '#06b6d4',
                        cyberNeonPink: '#ff2a8d',
                        cyberNeonCyan: '#00f0ff',
                        cyberNeonPurple: '#bf5af2',
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            background-color: #030207;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            overflow-x: hidden;
            min-height: 100dvh;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(14, 8, 28, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: #ff2a8d;
            border-radius: 4px;
        }

        .hud-card {
            background: rgba(18, 11, 36, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(191, 90, 242, 0.35);
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.45) 50%,
                rgba(0, 0, 0, 0.45)
            );
            background-size: 100% 4px;
        }

        .matrix-bg {
            background-image: radial-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 0);
            background-size: 12px 12px;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 42, 141, 0.8); }
            70% { box-shadow: 0 0 0 12px rgba(255, 42, 141, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 42, 141, 0); }
        }
        .mic-listening {
            animation: pulseGlow 1.4s infinite;
            background-color: #ff2a8d !important;
            color: #ffffff !important;
            border-color: #00f0ff !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .cyber-corner {
            position: relative;
        }
        .cyber-corner::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 8px;
            height: 8px;
            border-top: 2px solid #00f0ff;
            border-left: 2px solid #00f0ff;
            z-index: 25;
        }
        .cyber-corner::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 8px;
            height: 8px;
            border-bottom: 2px solid #ff2a8d;
            border-right: 2px solid #ff2a8d;
            z-index: 25;
        }

        .equalizer-bar {
            height: 20%;
            transition: height 0.08s ease-out;
        }
        
        .speaking-active .equalizer-bar {
            animation: bounce 0.4s ease-in-out infinite alternate;
        }
        .speaking-active .equalizer-bar:nth-child(2) { animation-delay: 0.1s; }
        .speaking-active .equalizer-bar:nth-child(3) { animation-delay: 0.2s; }
        .speaking-active .equalizer-bar:nth-child(4) { animation-delay: 0.3s; }
        .speaking-active .equalizer-bar:nth-child(5) { animation-delay: 0.15s; }

        @keyframes bounce {
            0% { height: 15%; }
            100% { height: 100%; }
        }
    </style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center p-0 sm:p-4 bg-slate-950">

    <!-- iPhone Screen Frame Container -->
    <div class="relative w-full max-w-[420px] h-[100dvh] sm:h-[890px] bg-black sm:rounded-[48px] p-2 sm:p-3 shadow-[0_0_60px_rgba(255,42,141,0.3)] border-0 sm:border-4 border-slate-900 flex flex-col overflow-hidden">
        
        <!-- Dynamic Island / Top Notch -->
        <div class="absolute top-3 left-1/2 -translate-x-1/2 w-28 sm:w-32 h-5 sm:h-6 bg-black rounded-full z-50 flex items-center justify-between px-3 border border-slate-800">
            <div class="w-2.5 h-2.5 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center">
                <div id="notch-dot" class="w-1 h-1 rounded-full bg-cyan-500/80"></div>
            </div>
            <div id="notch-speaker" class="w-2 h-1 rounded-full bg-purple-600/60"></div>
        </div>

        <!-- Inner Screen -->
        <div class="relative w-full h-full bg-[#06030c] rounded-[32px] sm:rounded-[38px] flex flex-col overflow-hidden border border-pink-500/30">
            
            <!-- Scanlines & Grid Overlay -->
            <div class="absolute inset-0 scanlines pointer-events-none z-40 opacity-20"></div>
            <div class="absolute inset-0 matrix-bg pointer-events-none z-10"></div>

            <!-- Header HUD -->
            <header class="relative z-30 pt-7 px-4 pb-2 border-b border-purple-500/30 bg-cyberDark/90 flex justify-between items-center">
                <div>
                    <h1 class="font-orbitron font-extrabold text-sm tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-400">
                        SUKIBOT // v2.0
                    </h1>
                    <p class="font-mono text-[10px] text-cyan-400/80">STATUS: <span id="status-text" class="text-pink-400">OFFLINE</span></p>
                </div>
                <div class="flex items-center space-x-2">
                    <div id="equalizer" class="flex items-end space-x-1 h-4 w-8">
                        <div class="equalizer-bar w-1 bg-cyan-400 rounded-full"></div>
                        <div class="equalizer-bar w-1 bg-pink-500 rounded-full"></div>
                        <div class="equalizer-bar w-1 bg-purple-500 rounded-full"></div>
                        <div class="equalizer-bar w-1 bg-cyan-400 rounded-full"></div>
                        <div class="equalizer-bar w-1 bg-pink-500 rounded-full"></div>
                    </div>
                </div>
            </header>

            <!-- Chat Output Container -->
            <main id="chat-box" class="relative z-30 flex-1 overflow-y-auto p-4 space-y-3 font-rajdhani text-sm no-scrollbar">
                <div class="hud-card p-3 rounded-lg cyber-corner">
                    <p class="font-orbitron text-xs text-cyan-400 mb-1">&gt; SYSTEM INIT</p>
                    <p class="text-slate-300">Welcome, Operator. WebLLM module ready. Tap microphone or type a command below to initialize connection.</p>
                </div>
            </main>

            <!-- Control & Input Dock -->
            <footer class="relative z-30 p-3 bg-cyberPanel/90 border-t border-purple-500/30 space-y-2">
                <form id="chat-form" class="flex items-center space-x-2">
                    <button type="button" id="mic-btn" class="w-10 h-10 rounded-lg bg-cyberCard border border-pink-500/40 text-pink-400 flex items-center justify-center hover:bg-pink-500/20 transition-all">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <input type="text" id="user-input" placeholder="Type prompt..." class="flex-1 bg-cyberCard border border-purple-500/40 rounded-lg px-3 py-2 text-xs font-mono text-cyan-300 focus:outline-none focus:border-cyan-400">
                    <button type="submit" class="w-10 h-10 rounded-lg bg-gradient-to-r from-pink-500 to-purple-600 text-white flex items-center justify-center font-bold">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </footer>
        </div>
    </div>

    <!-- Interaction & Engine Scripts -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const equalizer = document.getElementById('equalizer');

        // Web Speech API Integration
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('mic-listening');
                statusText.innerText = 'LISTENING...';
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('mic-listening');
                statusText.innerText = 'ONLINE';
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage(transcript);
            };
        } else {
            micBtn.style.display = 'none';
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // Speech Synthesis
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                equalizer.classList.add('speaking-active');
                
                utterance.onend = () => {
                    equalizer.classList.remove('speaking-active');
                };
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // Output formatting
        function appendMessage(sender, text) {
            const card = document.createElement('div');
            card.className = `hud-card p-3 rounded-lg ${sender === 'USER' ? 'border-cyan-500/40 ml-6 bg-cyan-950/20' : 'border-pink-500/40 mr-6 bg-pink-950/20'}`;
            card.innerHTML = `
                <p class="font-orbitron text-xs ${sender === 'USER' ? 'text-cyan-400' : 'text-pink-400'} mb-1">&gt; ${sender}</p>
                <p class="text-slate-200 text-xs">${text}</p>
            `;
            chatBox.appendChild(card);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Form Submit
        function sendMessage(text) {
            if (!text.trim()) return;
            appendMessage('USER', text);
            userInput.value = '';

            statusText.innerText = 'PROCESSING...';
            setTimeout(() => {
                const response = `[SUKI_AI]: Processing query "${text}". Standby for cyber updates.`;
                appendMessage('SUKIBOT', response);
                speak(response);
                statusText.innerText = 'ONLINE';
            }, 800);
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage(userInput.value);
        });

        window.addEventListener('mlc-loaded', () => {
            statusText.innerText = 'ONLINE';
        });
    </script>
</body>
</html>
